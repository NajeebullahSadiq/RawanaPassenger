name: passenger_app
description: Rawana passenger ride-hailing app for Afghanistan
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rawana_core:
    path: packages/rawana_core
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  geolocator: ^13.0.4
  permission_handler: ^11.4.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
  connectivity_plus: ^6.1.4
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  latlong2: ^0.9.1
  intl: any
  lucide_icons_flutter: 3.1.14+2
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/app_icon.png
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#1877F2"
  windows:
    generate: true
    image_path: assets/app_icon.png
  macos:
    generate: true
    image_path: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - .env
