name: passenger_app
description: Rawana passenger ride-hailing app for Afghanistan
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rawana_core:
    path: packages/rawana_core
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  geolocator: ^13.0.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  latlong2: ^0.9.1
  intl: ^0.20.2
  lucide_icons_flutter: 3.1.14+2
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#1877F2"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  adaptive_icon_monochrome: assets/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#1877F2"
  windows:
    generate: true
    image_path: assets/app_icon.png
  macos:
    generate: true
    image_path: assets/app_icon.png

flutter_native_splash:
  color: "#1877F2"
  image: assets/app_icon_foreground.png
  android_12:
    color: "#1877F2"
    icon_background_color: "#1877F2"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
