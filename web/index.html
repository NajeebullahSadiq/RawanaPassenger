<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="passenger_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>passenger_app</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Maps JS is injected from Dart (GOOGLE_MAPS_WEB_API_KEY in .env) -->
  <!-- Required by supabase_flutter auth on web -->
  <script src="passkeys_bundle.js" type="application/javascript"></script>
</head>
<body>
  <script>
    // Work around Flutter DWDS firing dart-app-ready more than once during debug
    // reconnects, which otherwise throws: Cannot read properties of null (reading
    // 'removeChild') in main.dart.js.
    document.addEventListener('dart-app-ready', function (e) {
      document.querySelectorAll('.flutter-loader').forEach(function (el) { el.remove(); });
      document.querySelectorAll('style').forEach(function (el) {
        if (el.textContent && el.textContent.indexOf('.flutter-loader') !== -1) {
          el.remove();
        }
      });
      e.stopImmediatePropagation();
    }, true);
  </script>
  <script>
    // Mitigate Flutter web viewInsets desync when the virtual keyboard opens/closes.
    // See: https://github.com/flutter/flutter/issues/175074
    (function () {
      var viewport = window.visualViewport;
      if (!viewport) return;

      var lastHeight = viewport.height;
      viewport.addEventListener('resize', function () {
        var currentHeight = viewport.height;
        if (currentHeight > lastHeight + 10) {
          window.scrollTo(0, 0);
          var active = document.activeElement;
          if (
            active &&
            (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')
          ) {
            active.blur();
          }
        }
        lastHeight = currentHeight;
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
