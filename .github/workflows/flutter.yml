name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/rawana_core && flutter pub get)
      # Warnings and errors fail the build; infos are reported only.
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Design-system lint
        shell: pwsh
        run: ./tool/ui_lint.ps1
      - name: App tests
        run: flutter test
      - name: rawana_core tests
        working-directory: packages/rawana_core
        run: flutter test

  android-release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Proves R8/minify and resources compile; the artifact is debug-signed and not for release.
      - name: Build release APK (unsigned check)
        env:
          RAWANA_ALLOW_DEBUG_SIGNING: 'true'
        run: flutter build apk --release --dart-define=APP_ENV=prod --obfuscate --split-debug-info=build/symbols
