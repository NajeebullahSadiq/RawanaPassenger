name: rawana_core
description: Shared Rawana Flutter package - theme, l10n, AFN currency, API client
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.8.0+1
  geolocator: ^13.0.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.1.0
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.12.1
  google_maps_flutter_platform_interface: ^2.15.0
  latlong2: ^0.9.1
  supabase_flutter: ^2.9.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/logo.svg
    - assets/app_icon.png
  fonts:
    - family: Bahij Zar
      fonts:
        - asset: fonts/BahijZar-Regular.ttf
          weight: 400
        - asset: fonts/BahijZar-Regular.ttf
          weight: 500
        - asset: fonts/BahijZar-Bold.ttf
          weight: 600
        - asset: fonts/BahijZar-Bold.ttf
          weight: 700
        - asset: fonts/BahijZar-Bold.ttf
          weight: 800
